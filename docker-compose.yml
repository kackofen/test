services:
  brasili:
    build: .
    container_name: brasili
    restart: unless-stopped
    environment:
      PORT: "8090"
      DATA_DIR: /data
      # Levels open by playing (the one before must be finished). For testing "1" opens every level
      # for everybody; admins can also switch it on for themselves with the TEST button on the map.
      UNLOCK_ALL: "0"
      # Your e-mail address(es), comma separated -> admin functions (test button, reset levels)
      ADMIN_EMAILS: ""
      # Optional team code that is needed to sign up (keeps the game to your team)
      INVITE_CODE: ""
      # Optional key for the dashboard leaderboard: board.html?key=...
      BOARD_KEY: ""
      # Which try counts for the leaderboard: "best" (best finished try) or "first" (first finished try)
      SCORE_MODE: best
      COOKIE_SECURE: auto
      # Pages allowed to embed board.html in an iframe (your dashboard)
      FRAME_ANCESTORS: "'self' https://clink.com.de"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8090:8090"
